    <script>
        function guess_syntax() {
            fetch("/api/v2/guess-syntax", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: new URLSearchParams({
                    content: document.getElementById("id_content").value
                })
            })
            .then(response => response.json())
            .then(set_syntax);
        }
        function set_syntax(data, _status, _jqxhr) {
            const syntaxEl = document.getElementById("id_syntax");
            const syntax = syntaxEl.value;
            const guess = data[1];

            if (syntax === "text" && syntax !== guess) {
                syntaxEl.value = guess;
                document.pasteform.dispatchEvent(new CustomEvent("syntax-guessed"));
            }
        }

    </script>
